name: Deploy ebp_netsuite to Production

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            export PATH="/root/.nvm/versions/node/v22.22.0/bin:$PATH"
            cd ${{ vars.PROJECT_PATH }}
            
            # Backup .env before any git operations
            if [ -f .env ]; then
              cp .env /tmp/.env.backup
            fi
            
            # Stash any local changes (including dist/ files)
            git stash push -m "deploy-stash-$(date +%s)" || true
            
            # Clean untracked files (dist/ build outputs)
            git clean -fd || true
            
            # Update code from main
            git fetch origin
            git reset --hard origin/main
            
            # Restore .env if it was backed up
            if [ -f /tmp/.env.backup ]; then
              cp /tmp/.env.backup .env
              rm /tmp/.env.backup
            fi
            
            # Install dependencies
            npm ci
            
            # Restart app (only if process exists in PM2)
            pm2 describe ${{ vars.PM2_APP_NAME }} > /dev/null 2>&1 && pm2 reload ${{ vars.PM2_APP_NAME }} || echo "Process not running, skipping restart"
            pm2 save